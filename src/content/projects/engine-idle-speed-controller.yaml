title: Engine idle speed controller
order: 8
place: ETH Zurich
status: Real engine
realHardware: true
summary: Model-based LQGI controller for a 2.5 L SI engine, validated on a real engine.
bullets:
- Built a nonlinear mean-value model of the engine (throttle, intake manifold, torque generation, inertia).
- Identified model parameters from test-bench data and validated the model on unseen measurements.
- Designed an LQG controller with integral action, coordinating throttle and ignition retardation to reject load disturbances with zero steady-state error.
- Discretized the controller and validated it on the real engine under random load changes.
tools:
- MATLAB
- Simulink
figure: idle
