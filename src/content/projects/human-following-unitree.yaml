title: Human-following Unitree quadruped
place: RobotHack 2026, EPFL AI Team
status: Real quadruped
realHardware: true
summary: Vision-based person following, implemented and tested on a real Unitree robot.
bullets:
  - >-
    Built a controller that makes a Unitree quadruped follow a person: YOLOv8
    person detection generates velocity commands sent to the robot's high-level
    sport-mode interface over ROS2.
  - >-
    Deployed and tested the full pipeline on the physical robot, using its state
    feedback and command topics through the Unitree Go2 software stack.
tools:
  - Python
  - ROS2
  - YOLOv8
