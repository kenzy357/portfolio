title: Planning & Decision Making for Autonomous Robots
order: 9
place: ETH Zurich
status: Course series
realHardware: false
summary: Graph search, steering, collision checking, trajectory optimization and multi-agent planning.
bullets:
  - Implemented graph search (BFS/DFS, Dijkstra, A*), dynamic programming, Dubins path steering and collision checking for robot motion planning.
  - "Spaceship docking: built a closed-loop planner using successive convexification (SCvx) to reach a target pose and velocity while avoiding planets and moving asteroids, with replanning to recover from external disturbances."
  - "Multi-agent goal collection: designed a global task allocation and path planning layer for a fleet of differential-drive robots, combined with decentralized local control and collision avoidance using only onboard lidar observations."
tools:
  - Python
  - CVXPY
  - SymPy
  - Shapely
figure: rrt
